    let countdownInterval;
    let audioCtx;
    let noiseSource;

    function speak(text, lang = 'pl-PL', callback) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang;
      utterance.onend = () => {
        if (callback) callback();
      };
      speechSynthesis.speak(utterance);
    }

    function playSilentWhiteNoise(duration = 5000) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const bufferSize = audioCtx.sampleRate * duration / 1000;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * 0.0001;
      }
      noiseSource = audioCtx.createBufferSource();
      noiseSource.buffer = buffer;
      const gainNode = audioCtx.createGain();
      gainNode.gain.value = 0.0001;
      noiseSource.connect(gainNode).connect(audioCtx.destination);
      noiseSource.start();
      setTimeout(() => {
        noiseSource.stop();
        audioCtx.close();
      }, duration);
    }

    function getRandomWord() {
      return words[Math.floor(Math.random() * words.length)];
    }

    function startCycle() {
      document.getElementById('startBtn').style.display = 'none';
      nextWord();
    }

    function nextWord() {
      clearInterval(countdownInterval);
      speechSynthesis.cancel();
      document.getElementById('answer').textContent = '';
      const word = getRandomWord();
      document.getElementById('hint').textContent = word.hint;

      speak(word.hint, 'pl-PL', () => {
        let seconds = 5;
        document.getElementById('countdown').textContent = `⏳ ${seconds}s`;
        countdownInterval = setInterval(() => {
          seconds--;
          document.getElementById('countdown').textContent = `⏳ ${seconds}s`;
          if (seconds <= 0) {
            clearInterval(countdownInterval);
          }
        }, 1000);

        playSilentWhiteNoise(5000);
        setTimeout(() => {
          document.getElementById('answer').textContent = word.answer;
          speak(word.answer, 'en-US', () => {
            setTimeout(nextWord, 1000);
          });
        }, 5000);
      });
    }
